    <script>
      (function() {
        var stored = localStorage.getItem('theme');
        var isDark;
        if (stored === 'dark') {
          isDark = true;
        } else if (stored === 'light') {
          isDark = false;
        } else {
          isDark = !window.matchMedia || !window.matchMedia('(prefers-color-scheme: light)').matches;
        }
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
