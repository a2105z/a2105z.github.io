<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 &mdash; Aarav Mittal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; background: #060d1b; color: #eceff4;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center;
        }
        .wrap { padding: 2rem; }
        h1 { font-size: 7rem; font-weight: 800; color: #c9a44a; line-height: 1; margin-bottom: 0.5rem; letter-spacing: -0.03em; }
        p { color: #4b6080; font-size: 1rem; margin-bottom: 2rem; }
        a {
            display: inline-block; padding: 0.55rem 1.75rem;
            border: 1px solid #c9a44a; color: #c9a44a; border-radius: 4px;
            font-size: 0.85rem; font-weight: 600; text-decoration: none;
            transition: all 0.25s;
        }
        a:hover { background: #c9a44a; color: #060d1b; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>404</h1>
        <p>Page not found.</p>
        <a href="./">Go Home</a>
    </div>
</body>
</html>
